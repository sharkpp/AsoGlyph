# 電車の愛称。カタカナで書ける名を集めてある。
# ひらがな版は train_names_hiragana.yaml。
#
# 新幹線の愛称（のぞみ・ひかり）はどれもひらがななので、こちらには
# 入っていない。カタカナの愛称は在来線の特急と私鉄に多い。
#
# 語の選びかた:
#   - カタカナ 81 字だけで書ける名にする。「ヴ」は収集対象に無いので使わない
#   - 8 字までにする（「ー」も 1 字）。「スカイライナー」までは入るが、
#     「シーサイドライナー」「ロイヤルエクスプレス」は 1 セッション
#     （3〜5 分）で書き終わらない
#   - 「スーパーはくと」のようにひらがなが混じる名は入れない。カタカナだけを
#     集めている人には 1 語も出ないため
