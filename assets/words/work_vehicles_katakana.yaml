# はたらくくるまの名を、カタカナで書けるかたちにして集めてある。
# ひらがな版（work_vehicles_hiragana.yaml）と同じ 36 台を、カタカナで書く。
#
# 語の選びかた:
#   - カタカナ 81 字だけで書ける語にする。「ヴ」は収集対象に無いので使わない
#   - 8 字までにする（「ー」も 1 字）。「トーイングトラクター」
#     「ポテトハーベスター」「コンクリートミキサーシャ」は 1 セッション
#     （3〜5 分）で書き終わらない。長い名は短い通称にした
#     （コンクリートミキサーシャ → ミキサーシャ、パトロールカー → パトカー、
#     ハシゴショウボウシャ → ハシゴシャ）
#   - 「〜シャ」で終わる漢語の名も、カタカナで書く。版をまたいで同じ 36 台に
#     しておかないと、ひらがなで書けた車がカタカナでは出てこなくなる
#   - 短い語を先に置く
