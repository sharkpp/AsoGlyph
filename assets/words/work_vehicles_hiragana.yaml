# はたらくくるまの名を、ひらがなで書けるかたちにして集めてある。
# カタカナ版は work_vehicles_katakana.yaml。
#
# 語の選びかた:
#   - ひらがな 80 字だけで書ける語にする。長音符「ー」はひらがなに無いので
#     （CharSet.hiragana）、「くれーんしゃ」「ぶるどーざー」のような語は
#     ここには置かない。置くと、ひらがなを集めている人には 1 語も出ない。
#     歌の 36 台のうち半分がこれで落ちる（ぱとかー・れっかーしゃ・
#     たんくろーりー・ふぉーくりふと・しょべるかー・くれーんしゃ ほか）
#   - 8 字までにする。「てれびちゅうけいしゃ」「きゅうしょくうんぱんしゃ」は
#     1 セッション（3〜5 分）で書き終わらない
#   - 「〜しゃ」で終わる名が多く、拗音・濁音はどうしても入る。短い語を先に置く
version: 1
name: はたらくくるま（ひらがな）
